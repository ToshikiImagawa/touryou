name: CI

# ubuntu（node 22・24）。macOS は ci-macos.yml（コードが変わったときだけ。macOS の runner の費用のため）。
# docs・.sdd・CHANGELOG・README・LICENSE だけの変更では動かさない（コードに関わらない変更で runner を使わないため。docs/release.md の「CI の実行時間と費用」）。
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".sdd/**"
      - "CHANGELOG.md"
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".sdd/**"
      - "CHANGELOG.md"
      - "README.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check.sh
